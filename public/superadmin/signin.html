<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Admin sign in - HealthClouda management portal">
  <title>HealthClouda | Admin Sign In</title>
  <link rel="icon" type="image/png" href="../../assets/images/HealthClouda-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Styles from assets/ -->
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script>var HC_V = new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
  document.write('<link rel="stylesheet" href="../../assets/css/signin.css?v=' + HC_V + '">');</script>
</head>
<body class="signin-page">

  <!-- <nav class="signin-nav">
    <div class="signin-nav-logo">
      <span>HealthClouda</span>
    </div>
    <a href="../signin.html" class="signin-back-btn">&larr; Back to Sign In</a>
  </nav> -->

  <div class="signin-page-body admin-signin">

    <div class="signin-card-header">
      <h1>Admin Login</h1>
      <p>Superadmin access only</p>
    </div>

    <div class="signin-card">
      <form class="signin-form" id="signinForm">

        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/>
                <polyline points="22,6 12,12 2,6"/>
              </svg>
            </span>
            <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show/hide password">
              <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="signinError" class="error-message" role="alert"></div>

        <button type="submit" class="signin-btn" id="signinBtn">Sign In</button>

      </form>
    </div>

  </div>

  <!-- JS load order: config → api → auth -->
  <script>
    ['../../assets/js/config.js','../../assets/js/api.js','../../assets/js/auth.js'].forEach(function(src){
      document.write('<script src="'+src+'?v='+HC_V+'"><\/script>');
    });
  </script>
  <script>
    hc_makePasswordToggle('togglePw', 'eyeIcon', 'password');
    hc_initAdminSigninForm();
    hc_fadeInCard();
  </script>

</body>
</html>
