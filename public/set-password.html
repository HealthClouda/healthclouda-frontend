<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Set up your HealthClouda account password">
  <title>HealthClouda | Set Up Your Password</title>
  <link rel="icon" type="image/png" href="/assets/images/HealthClouda-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>var HC_V = new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
  document.write('<link rel="stylesheet" href="/assets/css/signin.css?v=' + HC_V + '">');</script>
</head>
<body class="signin-page">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav class="signin-nav">
    <div class="signin-nav-logo">
      <img src="/assets/images/HealthClouda-icon.png" alt="">
      <span>HealthClouda</span>
    </div>
    <a href="/signin/" class="signin-back-btn">← Back to Login</a>
  </nav>

  <div class="signin-page-body">

    <!-- Error state (shown when token is invalid/expired/missing) -->
    <div id="setupErrorState" class="signin-card-header" style="display:none;">
      <div class="fp-icon" style="color:#dc2626;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </div>
    </div>

    <!-- Welcome header (shown after successful token validation) -->
    <div class="signin-card-header" id="setupHeader" style="display:none;">
      <div class="fp-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>Welcome, <span id="setupUserName"></span></h1>
      <p>Your account has been created as <strong id="setupUserRole"></strong>. Set a password to get started.</p>
    </div>

    <!-- Password form (shown after successful token validation) -->
    <div class="signin-card" id="setupFormCard" style="display:none;">
      <form class="signin-form" id="setupForm">

        <div class="form-group">
          <label for="setupUserEmail">Email</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M22 7l-10 7L2 7"/>
              </svg>
            </span>
            <input type="email" id="setupUserEmail" readonly tabindex="-1" style="opacity:0.7;cursor:default;">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="new-password">
            <button type="button" class="toggle-pw" id="togglePw1" aria-label="Show/hide password">
              <svg id="eyeIcon1" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
          <ul class="pw-requirements">
            <li id="req-len"><span class="req-dot"></span>At least 8 characters</li>
            <li id="req-upper"><span class="req-dot"></span>One uppercase letter</li>
            <li id="req-num"><span class="req-dot"></span>One number</li>
            <li id="req-special"><span class="req-dot"></span>One special character</li>
          </ul>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
            <button type="button" class="toggle-pw" id="togglePw2" aria-label="Show/hide confirm password">
              <svg id="eyeIcon2" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="match-msg" id="matchMsg"></div>
        </div>

        <div id="setupError" role="alert" style="color:#dc2626;font-size:0.82rem;min-height:1.1rem;text-align:center;margin-bottom:0.5rem;"></div>

        <button type="submit" class="signin-btn" id="setupBtn" disabled>Set Password</button>

      </form>
    </div>

    <a href="/signin/" class="back-to-login">← Back to Login</a>

  </div>

  <script>
    ['/assets/js/config.js','/assets/js/router.js','/assets/js/api.js','/assets/js/auth.js'].forEach(function(src){
      document.write('<script src="'+src+'?v='+HC_V+'"><\/script>');
    });
  </script>
  <script>
    hc_makePasswordToggle('togglePw1', 'eyeIcon1', 'password');
    hc_makePasswordToggle('togglePw2', 'eyeIcon2', 'confirmPassword');
    hc_initSetupPasswordForm();
    hc_fadeInCard();
  </script>

</body>
</html>
