<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Password successfully reset - HealthClouda">
  <title>HealthClouda | Password Reset Successful</title>
  <link rel="icon" type="image/png" href="/assets/images/HealthClouda-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script>var HC_V = new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
  document.write('<link rel="stylesheet" href="/organization/style.css?v=' + HC_V + '">');</script>
</head>
<body class="signin-page">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav class="signin-nav">
    <div class="signin-nav-logo">
      <img id="nav-logo" src="" alt="" style="height:32px;">
      <span id="nav-org-name"></span>
    </div>
    <a href="./signin.html" class="signin-back-btn">← Back to Login</a>
  </nav>

  <div class="signin-page-body">

    <div class="signin-card-header">
      <div class="success-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0075FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h1>Password reset</h1>
      <p class="success-sub">
        Congratulations! Your password has been<br>
        changed. Click continue to login.
      </p>
    </div>

    <div class="signin-card" style="text-align:center;">
      <div class="signin-form">
        <a href="./signin.html" class="signin-btn" id="continueBtn"
          style="display:flex;align-items:center;justify-content:center;text-decoration:none;">
          Continue
          <span id="countdown" style="font-size:0.8rem;opacity:0.75;margin-left:0.25rem;">(5)</span>
        </a>
      </div>
    </div>

  </div>

  <!-- Load order: config → api → auth → org-config → inline branding -->
  <script>
    ['/assets/js/config.js','/assets/js/router.js','/assets/js/api.js','/assets/js/auth.js','/organization/org-config.js'].forEach(function(src){
      document.write('<script src="'+src+'?v='+HC_V+'"><\/script>');
    });
  </script>
  <script>
    // Wire success page — clears sessionStorage + countdown redirect
    hc_initPasswordSuccess(HC_ROUTER.signinPath());

    // Org branding
    document.title = ORG_CONFIG.name + ' | Password Reset Successful';
    document.getElementById('nav-logo').src             = ORG_CONFIG.logo;
    document.getElementById('nav-logo').alt             = ORG_CONFIG.name + ' logo';
    document.getElementById('nav-org-name').textContent = 'HealthClouda';

    hc_fadeInCard();

    var _signinHref = HC_ROUTER.signinPath();
    document.querySelectorAll('a[href="./signin.html"]').forEach(function(a){ a.href = _signinHref; });
  </script>

</body>
</html>
