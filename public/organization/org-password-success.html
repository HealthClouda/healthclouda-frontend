<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthClouda | Password Reset Successful</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./signin.css">
</head>
<body class="signin-page">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav class="signin-nav">
    <div class="signin-nav-logo">
      <img id="nav-logo" src="" alt="" style="height:32px;">
      <span id="nav-org-name"></span>
    </div>
    <a href="./signin.html" class="signin-back-btn">← Back to Login</a>
  </nav>

  <div class="signin-page-body">

    <div class="signin-card-header">
      <div class="success-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0075FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h1>Password reset</h1>
      <p class="success-sub">
        Congratulations! Your password has been<br>
        changed. Click continue to login.
      </p>
    </div>

    <div class="signin-card" style="text-align:center;">
      <div class="signin-form">
        <a href="./signin.html" class="signin-btn" id="continueBtn"
          style="display:flex;align-items:center;justify-content:center;text-decoration:none;">
          Continue
          <span id="countdown" style="font-size:0.8rem;opacity:0.75;margin-left:0.25rem;">(5)</span>
        </a>
      </div>
    </div>

  </div>

  <!-- No auth.js needed — no forms on this page -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="./org-config.js"></script>
  <script>
    document.title = ORG_CONFIG.name + ' | Password Reset Successful';
    document.getElementById('nav-logo').src             = ORG_CONFIG.logo;
    document.getElementById('nav-logo').alt             = ORG_CONFIG.name + ' logo';
    document.getElementById('nav-org-name').textContent = 'HealthClouda';

    // Card fade-in
    const card = document.querySelector('.signin-card');
    card.style.cssText += 'opacity:0;transform:translateY(24px);transition:opacity 0.5s ease,transform 0.5s ease;';
    requestAnimationFrame(() => { card.style.opacity = '1'; card.style.transform = 'translateY(0)'; });

    // Auto-redirect countdown
    let secs = 5;
    const countdownEl = document.getElementById('countdown');
    const interval = setInterval(() => {
      secs--;
      countdownEl.textContent = '(' + secs + ')';
      if (secs <= 0) { clearInterval(interval); window.location.href = './signin.html'; }
    }, 1000);
  </script>

</body>
</html>
