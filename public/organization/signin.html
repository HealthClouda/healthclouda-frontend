<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthClouda | Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./signin.css">
</head>
<body class="signin-page">

  <nav class="signin-nav">
    <div class="signin-nav-logo">
      <img id="nav-logo" src="" alt="" style="height:32px;">
      <span id="nav-org-name"></span>
    </div>
    <a href="./index.html" class="signin-back-btn">← Back to Home</a>
  </nav>

  <div class="signin-page-body">

    <div class="signin-card-header">
      <h1>Sign in to <br><span id="header-org-name"></span><br> HealthClouda</h1>
      <p>Access your healthcare dashboard</p>
    </div>

    <div class="signin-card">
      <form class="signin-form" id="signinForm">

        <div class="form-group">
          <label for="email">Email / HealthClouda ID</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/>
                <polyline points="22,6 12,12 2,6"/>
              </svg>
            </span>
            <input type="text" id="email" name="email" placeholder="" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show/hide password">
              <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="signinError" role="alert" style="color:#dc2626;font-size:0.82rem;min-height:1.1rem;text-align:center;margin-bottom:0.5rem;"></div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" id="remember">
            <span>Remember me</span>
          </label>
          <a href="./forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="signin-btn" id="signinBtn">Sign In</button>

        <p class="no-account-text">Don't have an account?</p>

        <div class="signin-notice">
          <p><strong>Notice:</strong> HealthClouda accounts cannot be created online. Please visit the reception desk at your organisation clinic — admin staff will create your login.</p>
        </div>

      </form>
    </div>
  </div>

  <!-- JS at bottom of body: DOM is fully parsed before any script runs -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="./org-config.js"></script>
  <script>
    // Org branding — DOM is ready here
    document.title = ORG_CONFIG.name + ' | HealthClouda Sign In';
    document.getElementById('nav-logo').src                = ORG_CONFIG.logo;
    document.getElementById('nav-logo').alt                = ORG_CONFIG.name + ' logo';
    document.getElementById('nav-org-name').textContent    = 'HealthClouda';
    document.getElementById('header-org-name').textContent = ORG_CONFIG.name;
    document.getElementById('email').placeholder           = ORG_CONFIG.emailPlaceholder || 'Enter your email or HealthClouda ID';

    // Auth logic from auth.js — DOM is ready here too
    hc_makePasswordToggle('togglePw', 'eyeIcon', 'password');
    hc_initSigninForm();
    hc_fadeInCard();
  </script>

</body>
</html>
