<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthClouda | Set New Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="signin-page">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav class="signin-nav">
    <div class="signin-nav-logo">
      <img id="nav-logo" src="" alt="" style="height:32px;">
      <span id="nav-org-name"></span>
    </div>
    <a href="./signin.html" class="signin-back-btn">← Back to Login</a>
  </nav>

  <div class="signin-page-body">

    <div class="signin-card-header">
      <div class="fp-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>Set a new password</h1>
      <p>Create a new password. Ensure it differs from previous ones for security.</p>
    </div>

    <div class="signin-card">
      <form class="signin-form" id="resetForm">

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your new password" required autocomplete="new-password">
            <button type="button" class="toggle-pw" id="togglePw1" aria-label="Show/hide password">
              <svg id="eyeIcon1" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
          <ul class="pw-requirements">
            <li id="req-len"><span class="req-dot"></span>At least 8 characters</li>
            <li id="req-upper"><span class="req-dot"></span>One uppercase letter</li>
            <li id="req-num"><span class="req-dot"></span>One number</li>
            <li id="req-special"><span class="req-dot"></span>One special character</li>
          </ul>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your new password" required autocomplete="new-password">
            <button type="button" class="toggle-pw" id="togglePw2" aria-label="Show/hide confirm password">
              <svg id="eyeIcon2" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="match-msg" id="matchMsg"></div>
        </div>

        <div id="resetError" role="alert" style="color:#dc2626;font-size:0.82rem;min-height:1.1rem;text-align:center;margin-bottom:0.5rem;"></div>

        <button type="submit" class="signin-btn" id="updateBtn" disabled>Update Password</button>

      </form>
    </div>

    <a href="./check-email.html" class="back-to-login">← Back</a>

  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="./org-config.js"></script>
  <script>
    document.title = ORG_CONFIG.name + ' | Set New Password';
    document.getElementById('nav-logo').src             = ORG_CONFIG.logo;
    document.getElementById('nav-logo').alt             = ORG_CONFIG.name + ' logo';
    document.getElementById('nav-org-name').textContent = 'HealthClouda';

    hc_makePasswordToggle('togglePw1', 'eyeIcon1', 'password');
    hc_makePasswordToggle('togglePw2', 'eyeIcon2', 'confirmPassword');
    hc_initResetForm('./password-success.html');
    hc_fadeInCard();
  </script>

</body>
</html>
