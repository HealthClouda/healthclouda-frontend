<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Reset your HealthClouda password">
  <title>HealthClouda | Forgot Password</title>
  <link rel="icon" type="image/png" href="/assets/images/HealthClouda-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script>var HC_V = new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
  document.write('<link rel="stylesheet" href="./style.css?v=' + HC_V + '">');</script>
</head>
<body class="signin-page">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav class="signin-nav">
    <div class="signin-nav-logo">
      <img id="nav-logo" src="" alt="" style="height:32px;">
      <span id="nav-org-name"></span>
    </div>
    <a href="./signin.html" class="signin-back-btn">← Back to Login</a>
  </nav>

  <div class="signin-page-body">

    <div class="signin-card-header">
      <div class="fp-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Forgot password?</h1>
      <p>Please enter your email to reset the password</p>
    </div>

    <div class="signin-card">
      <form class="signin-form" id="forgotForm">

        <div class="form-group">
          <label for="email">Your Email</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/>
                <polyline points="22,6 12,12 2,6"/>
              </svg>
            </span>
            <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
          </div>
        </div>

        <div id="forgotError" role="alert" style="color:#dc2626;font-size:0.82rem;min-height:1.1rem;text-align:center;margin-bottom:0.5rem;"></div>

        <button type="submit" class="signin-btn" id="submitBtn">Reset Password</button>

      </form>
    </div>

    <a href="./signin.html" class="back-to-login">← Back to login</a>

  </div>

  <script>
    ['/assets/js/config.js','/assets/js/router.js','/assets/js/api.js','/assets/js/auth.js','./org-config.js'].forEach(function(src){
      document.write('<script src="'+src+'?v='+HC_V+'"><\/script>');
    });
  </script>
  <script>
    document.title = ORG_CONFIG.name + ' | Forgot Password';
    document.getElementById('nav-logo').src             = ORG_CONFIG.logo;
    document.getElementById('nav-logo').alt             = ORG_CONFIG.name + ' logo';
    document.getElementById('nav-org-name').textContent = 'HealthClouda';

    hc_initForgotForm(HC_ROUTER.passwordFlowPath('check-email'));
    hc_fadeInCard();

    // Update back-to-login links to use org-scoped signin path
    var _signinHref = HC_ROUTER.signinPath();
    document.querySelectorAll('a[href="./signin.html"]').forEach(function(a){ a.href = _signinHref; });
  </script>

</body>
</html>
