<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal | HealthClouda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Lato', sans-serif; background: #f4f8ff; min-height: 100vh; }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      background: #fff; border-bottom: 1px solid rgba(0,117,255,0.08);
      z-index: 100;
    }
    .topbar-brand { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 1.15rem; color: #000825; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-user { font-size: 0.85rem; color: #374151; }
    .topbar-role { font-size: 0.72rem; color: #10B981; background: #ecfdf5; padding: 2px 8px; border-radius: 6px; font-weight: 600; text-transform: uppercase; }

    .logout-btn {
      padding: 0.4rem 1rem; font-size: 0.82rem; font-weight: 600;
      color: #dc2626; background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { background: #dc2626; color: #fff; }

    .dashboard-body { max-width: 900px; margin: 0 auto; padding: 100px 1.5rem 3rem; }

    .welcome-card {
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      color: #fff; border-radius: 16px; padding: 2rem 2.25rem; margin-bottom: 2rem;
    }
    .welcome-card h1 { font-family: 'Inter', sans-serif; font-size: 1.6rem; font-weight: 700; margin-bottom: 0.35rem; }
    .welcome-card p { font-size: 0.9rem; opacity: 0.85; }

    /* ── Episodes list ────────────────── */
    .section-title {
      font-family: 'Inter', sans-serif; font-size: 1.15rem; font-weight: 700;
      color: #000825; margin-bottom: 1rem;
    }

    .episode-card {
      background: #fff; border-radius: 14px; padding: 1.5rem;
      border: 1px solid rgba(0,117,255,0.1); box-shadow: 0 2px 12px rgba(0,117,255,0.06);
      margin-bottom: 1rem;
    }
    .episode-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .episode-date { font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; color: #0075FF; }
    .episode-org { font-size: 0.78rem; color: #6B7280; background: #f3f4f6; padding: 2px 8px; border-radius: 6px; }

    .episode-field { margin-bottom: 0.6rem; }
    .episode-field-label { font-size: 0.72rem; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.15rem; }
    .episode-field-value { font-size: 0.88rem; color: #374151; line-height: 1.5; }

    .no-episodes { text-align: center; color: #6B7280; padding: 3rem 1rem; font-size: 0.95rem; }
    .loading-msg { text-align: center; color: #6B7280; padding: 2rem; }
    .error-msg { text-align: center; color: #dc2626; padding: 2rem; }

    @media (max-width: 640px) {
      .topbar { padding: 0 1rem; }
      .dashboard-body { padding: 80px 1rem 2rem; }
      .welcome-card { padding: 1.5rem; }
      .welcome-card h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="topbar-brand">HealthClouda</span>
    <div class="topbar-right">
      <span class="topbar-role" id="userRole">Patient</span>
      <span class="topbar-user" id="userName">Loading...</span>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="dashboard-body">
    <div class="welcome-card">
      <h1 id="welcomeMsg">Welcome to your Patient Portal</h1>
      <p>View your medical records and episode history.</p>
    </div>

    <h2 class="section-title">Your Episodes</h2>
    <div id="episodesContainer">
      <div class="loading-msg" id="statusMsg">Loading your episodes...</div>
    </div>
  </main>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    hc_requireAuth();

    (async function () {
      const container = document.getElementById('episodesContainer');
      const statusMsg = document.getElementById('statusMsg');

      // 1. Load user profile
      try {
        const me = await apiGet(HC_CONFIG.ENDPOINTS.ME);

        const fullName = [me.first_name, me.last_name].filter(Boolean).join(' ') || me.email;
        document.getElementById('userName').textContent = fullName;
        document.getElementById('userRole').textContent = me.role || 'Patient';
        document.getElementById('welcomeMsg').textContent = 'Welcome, ' + fullName;
      } catch (err) {
        statusMsg.className = 'error-msg';
        statusMsg.textContent = err.message || 'Failed to load profile.';
        document.getElementById('logoutBtn').addEventListener('click', hc_logout);
        return;
      }

      // 2. Load episodes
      try {
        const data = await apiGet(HC_CONFIG.ENDPOINTS.EPISODES);

        // API may return paginated { results: [] } or a flat array
        const episodes = Array.isArray(data) ? data : (data.results || []);

        if (episodes.length === 0) {
          container.innerHTML = '<div class="no-episodes">No episodes found. Your medical visits will appear here.</div>';
        } else {
          container.innerHTML = episodes.map(renderEpisodeCard).join('');
        }
      } catch (err) {
        container.innerHTML = '<div class="error-msg">' + escapeHtml(err.message || 'Failed to load episodes.') + '</div>';
      }

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', hc_logout);
    })();

    /**
     * Render a single episode card.
     * IMPORTANT: clinical_notes is intentionally excluded — patients must NOT see it.
     */
    function renderEpisodeCard(ep) {
      const date = ep.created_at
        ? new Date(ep.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
        : 'Date unknown';

      const orgName = ep.organization_name || ep.organization || '';

      let html = '<div class="episode-card">';
      html += '<div class="episode-header">';
      html += '  <span class="episode-date">' + escapeHtml(date) + '</span>';
      if (orgName) html += '  <span class="episode-org">' + escapeHtml(orgName) + '</span>';
      html += '</div>';

      if (ep.chief_complaint) {
        html += field('Chief Complaint', ep.chief_complaint);
      }
      if (ep.diagnosis) {
        html += field('Diagnosis', ep.diagnosis);
      }
      if (ep.prescribed_drugs) {
        html += field('Prescribed Drugs', ep.prescribed_drugs);
      }
      if (ep.patient_instructions) {
        html += field('Patient Instructions', ep.patient_instructions);
      }

      // clinical_notes is deliberately NOT rendered here

      html += '</div>';
      return html;
    }

    function field(label, value) {
      return '<div class="episode-field">'
        + '<div class="episode-field-label">' + escapeHtml(label) + '</div>'
        + '<div class="episode-field-value">' + escapeHtml(value) + '</div>'
        + '</div>';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>

</body>
</html>
